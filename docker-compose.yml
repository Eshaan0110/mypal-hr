# Local development services. Start with:  docker compose up -d
# Secrets come from the repo-root .env (git-ignored; copy .env.example).
name: mypal

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: mypal
      POSTGRES_USER: mypal
      # No password is stored in this file. Compose reads MYPAL_DB_PASSWORD from the repo-root
      # .env (git-ignored; copy .env.example) and refuses to start if it is missing.
      POSTGRES_PASSWORD: ${MYPAL_DB_PASSWORD:?Set MYPAL_DB_PASSWORD in .env - see .env.example}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: creates the separate test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypal -d mypal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector search index. A rebuildable copy derived from Postgres - never the source of truth.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      # Every request must carry this key. Read from .env, never stored in this file.
      QDRANT__SERVICE__API_KEY: ${MYPAL_QDRANT_API_KEY:?Set MYPAL_QDRANT_API_KEY in .env - see .env.example}
      # Do not send usage telemetry outside the machine.
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
