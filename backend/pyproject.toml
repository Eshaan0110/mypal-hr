[project]
name = "mypal"
version = "0.1.0"
description = "My Pal HR policy chatbot - backend API (prototype)"
readme = "README.md"
authors = [
    { name = "Eshaan0110", email = "eshaan.adyanthaya@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mypal-ingest = "mypal.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, S: security checks
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things
"tests/**" = ["S101"]
