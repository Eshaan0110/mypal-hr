# Serves the built chat interface and forwards /api to the backend container.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Policy uploads may be up to 20 MB (the backend checks the exact limit).
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A local language model can take up to MYPAL_LLM_TIMEOUT_SECONDS (180 s) to answer.
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
